name: Build TVBox source and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 10:17 and 22:17 China Standard Time; GitHub schedules use UTC.
    - cron: '17 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bili-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://shandianchengzi.github.io/bilibili-tvbox-forstudy' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Restore pinned Java dependency
        uses: actions/cache@v6
        with:
          path: .deps
          key: zxing-core-3.5.3-v1

      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile and validate native TVBox plugin
        run: bash scripts/build.sh

      - name: Restore last known catalog
        uses: actions/cache/restore@v6
        with:
          path: build/catalog.json
          key: public-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-catalog-v1-

      - name: Refresh public metadata
        if: github.event_name != 'pull_request'
        run: python3 scripts/crawl.py --config config/interests.json --output build/catalog.json --previous build/catalog.json --timeout 12 --attempts 2 --delay 1.5

      - name: Prepare catalog without network for pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/crawl.py --config config/interests.json --output build/catalog.json --previous build/catalog.json --max-queries 0

      - name: Assemble and verify Pages files
        run: |
          python3 scripts/build_site.py
          python3 scripts/verify.py --site dist/site

      - name: Save validated public catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build/catalog.json
          key: public-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Downloadable artifacts remain available even if Pages is not enabled yet.
      - name: Upload plugin and complete static site
        uses: actions/upload-artifact@v7
        with:
          name: bili-study-tvbox-${{ github.run_number }}
          path: |
            dist/bili-study.jar
            dist/site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain missing Pages setup
        if: steps.pages.outcome == 'failure'
        run: |
          echo '::error title=GitHub Pages is not configured::Open repository Settings > Pages, select GitHub Actions as the build source, and rerun this workflow. The compiled plugin and static site are already available in this run’s artifacts.'
          exit 1

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
